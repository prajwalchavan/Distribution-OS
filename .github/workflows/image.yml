name: image

# Builds the deployment image and pushes it to GHCR. It DEPLOYS NOTHING: there is no ssh step, no
# deploy key and no compose over the wire. The deploy is docs/30, run by a human or an agent on the
# box, and its rollback is one line in .env.prod. Keeping this separate from ci.yml is deliberate —
# a red image build must never be mistaken for a red test suite, and ci.yml's behaviour is unchanged.
#
# The VM is Oracle Always Free, which is Ampere: linux/arm64 is not a preference, an amd64 image
# simply does not start there.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU because ubuntu-latest is amd64. It makes the argon2 compile slow (it has no musl
      # prebuild, so it really is compiled). If this repo ever becomes public, swap `runs-on` for
      # `ubuntu-24.04-arm`, which is free for public repositories, and drop this step: the build is
      # then native and minutes faster.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<short> is the tag the runbook pins in .env.prod. `main` moves and is only ever a
      # convenience for a human reading the registry; nothing on the box may follow a moving tag,
      # because a reboot would then quietly change the version running.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/infra/docker/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the tag to put in .env.prod
        run: |
          echo "DOS_IMAGE=ghcr.io/${{ github.repository }}:sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_STEP_SUMMARY"
