# Expo / React Native tooling expects a flat node_modules in a monorepo.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false
engineStrict: true

packages:
  - libs/*
  - '*-app'

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Single source of truth for versions shared across the frontend packages. Keep typescript, eslint and
# prettier equal to backend/pnpm-workspace.yaml so both sides format and lint identically.
#
# THE EXPO SDK DECIDES react, react-dom, react-native and every `react-native-*` / `expo-*` version
# below (docs/08 section 0: "the frontend catalog follows the SDK, never the other way round"). The
# numbers are `expo@57.0.20`'s own `bundledNativeModules.json`; to move SDK, read that file again
# rather than bumping a line by hand.
catalog:
  typescript: 6.0.3
  turbo: 2.10.12
  prettier: 3.9.6
  eslint: 9.39.5
  '@eslint/js': 10.0.1
  typescript-eslint: 8.69.0
  eslint-config-prettier: 10.1.8
  vitest: 4.1.11
  '@types/node': 26.4.1
  '@orpc/client': 1.15.0
  '@orpc/contract': 1.15.0
  '@orpc/openapi-client': 1.15.0
  # `@dos/contracts` is LINKED from backend/libs and imports these at runtime. Metro resolves a linked
  # package's imports through the frontend's own node_modules (metro.config.js pins the lookup paths),
  # so they must exist here at exactly the versions backend/pnpm-workspace.yaml pins.
  '@orpc/openapi': 1.15.0
  zod: 4.5.4

  # --- Expo SDK 57 (expo@57.0.20) pins these ---------------------------------
  expo: 57.0.20
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-web: 0.21.2
  react-native-svg: 15.15.4
  react-native-safe-area-context: 5.7.0
  react-native-screens: 4.26.0
  react-native-gesture-handler: 2.32.0
  expo-router: 57.0.19
  expo-constants: 57.0.17
  expo-crypto: 57.0.2
  expo-linking: 57.0.9
  expo-status-bar: 57.0.1
  expo-splash-screen: 57.0.8
  expo-system-ui: 57.0.3
  expo-font: 57.0.3
  expo-secure-store: 57.0.3
  expo-camera: 57.0.4
  expo-image-picker: 57.0.16
  expo-location: 57.0.16
  expo-task-manager: 57.0.16
  expo-haptics: 57.0.2
  expo-sharing: 57.0.18
  expo-print: 57.0.1
  expo-document-picker: 57.0.1
  expo-file-system: 57.0.6
  expo-web-browser: 57.0.2
  '@expo/metro-runtime': 57.0.15
  babel-preset-expo: 57.0.10
  '@babel/core': 7.29.7

  # --- Types and the web-only gallery ----------------------------------------
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  vite: 8.2.2
  '@vitejs/plugin-react': 6.1.0
