# Expo / React Native tooling expects a flat node_modules in a monorepo.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false
engineStrict: true

packages:
  - libs/*
  - '*-app'

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Single source of truth for versions shared across the frontend packages. Keep typescript, eslint and
# prettier equal to backend/pnpm-workspace.yaml so both sides format and lint identically.
catalog:
  typescript: 6.0.3
  turbo: 2.10.12
  prettier: 3.9.6
  eslint: 9.39.5
  '@eslint/js': 10.0.1
  typescript-eslint: 8.69.0
  eslint-config-prettier: 10.1.8
  vitest: 4.1.11
  '@types/node': 26.4.1
  '@orpc/client': 1.15.0
  '@orpc/contract': 1.15.0
  '@orpc/openapi-client': 1.15.0
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@tanstack/react-query': 5.102.8
  vite: 8.2.2
  '@vitejs/plugin-react': 6.1.0
