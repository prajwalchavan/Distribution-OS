# Flat node_modules (same layout as the frontend workspace); switch to the isolated linker once phantom deps are audited.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false
engineStrict: true

packages:
  - libs/*
  - '*-service'
  - worker
  # All eight services (and optionally the worker) in ONE process behind path prefixes — the
  # least-cost deployment mode, founder 2026-09-05 (docs/26 §7). It composes the same
  # `ServiceDefinition`s the eight service packages export, and adds no dependency of its own.
  - all-in-one

allowBuilds:
  esbuild: true
  unrs-resolver: true
  '@swc/core': true
  argon2: true

# Single source of truth for versions shared across packages.
catalog:
  typescript: 6.0.3
  turbo: 2.10.12
  prettier: 3.9.6
  eslint: 9.39.5
  '@eslint/js': 10.0.1
  typescript-eslint: 8.69.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-boundaries: 7.2.0
  vitest: 4.1.11
  '@vitest/coverage-v8': 4.1.11
  tsx: 4.23.13
  '@swc/core': 1.16.1
  '@swc-node/register': 1.12.1
  unplugin-swc: 1.5.11
  zod: 4.5.4
  '@types/node': 26.4.1
  '@orpc/contract': 1.15.0
  '@orpc/server': 1.15.0
  '@orpc/client': 1.15.0
  '@orpc/nest': 1.15.0
  '@orpc/openapi': 1.15.0
  '@orpc/openapi-client': 1.15.0
  '@orpc/zod': 1.15.0
  '@nestjs/common': 12.0.1
  '@nestjs/core': 12.0.1
  '@nestjs/platform-fastify': 12.0.1
  '@nestjs/testing': 12.0.1
  '@nestjs/config': 12.0.0
  fastify: 5.12.1
  '@fastify/cors': 11.3.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  drizzle-zod: 0.8.3
  pg: 8.23.0
  '@types/pg': 8.23.1
  pg-boss: 12.30.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  dotenv: 17.4.2
